# Renders the app icon's SVG into PNG previews and the .ico (m5/14). Not a workspace member:
#   cargo run --release --manifest-path scripts/icon-gen/Cargo.toml -- <icon.svg> <out dir>
[package]
name = "icon-gen"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
resvg = "0.46"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
