# Renders the brand kit's SVGs into the app and tray .ico files and a preview. Not a workspace member:
#   cargo run --release --manifest-path scripts/icon-gen/Cargo.toml -- crates/supraman-app/assets/brand crates/supraman-app/assets
[package]
name = "icon-gen"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
resvg = "0.46"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
