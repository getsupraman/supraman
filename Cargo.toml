[workspace]
resolver = "2"
members = ["crates/supraman-core", "crates/supraman-claude", "crates/supraman-supervisor", "crates/supraman-workman", "crates/supraman-gitman", "crates/supraman-editor", "crates/supraman-git-view", "crates/supraman-term", "crates/supraman-ui", "crates/supraman-app", "crates/sm", "spikes/term-spike"]

[workspace.package]
license = "GPL-3.0-or-later"

# A panic's backtrace in supraman.log names file:line through the shipped supraman.pdb.
[profile.release]
debug = "line-tables-only"

# A unit's inner loop and gate (docs/DEVELOPING.md): the members incremental in many codegen units, the dependencies as release.
[profile.unit]
inherits = "release"
incremental = true
codegen-units = 256

[profile.unit.package."*"]
incremental = false
codegen-units = 16

# Copied from Zed's root Cargo.toml @ 03efd49220ba06703d04f9c4732fdf814f9c523c.
# Git dependencies do not inherit the upstream workspace's patches; these are the
# ones the gpui + supraman-term dependency tree actually resolves against.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
notify = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
# Zed's tree-sitter, for the grammar crates that bind through crates.io's (cortexkit-tree-sitter-scss, tree-sitter-less).
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
