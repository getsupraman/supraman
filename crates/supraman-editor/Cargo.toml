[package]
name = "supraman-editor"
version = "0.1.18"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
anyhow = "1"
buffer_diff = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
editor = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c", default-features = false }
grammars = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c", features = ["load-grammars"] }
language = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
log = "0.4"
multi_buffer = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
release_channel = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
semver = "1"
serde_json = "1.0.151"
settings = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
text = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
theme = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
theme_settings = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
tree-sitter-batch = "0.11.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-containerfile = "0.9.2"
tree-sitter-dart = "0.3.0"
tree-sitter-fsharp = "0.3.12"
tree-sitter-graphql = "0.3.0"
tree-sitter-hcl = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-less = "1.0.0"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-php = "0.25.1"
tree-sitter-powershell = "0.26.6"
tree-sitter-proto = "0.6.0"
tree-sitter-r = "1.3.0"
tree-sitter-razor = "0.1.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-scala = "0.26.4"
tree-sitter-scss = { package = "cortexkit-tree-sitter-scss", version = "1.0.1" }
tree-sitter-sequel = "0.3.11"
tree-sitter-swift = "0.7.4"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-vb-dotnet = "0.1.0"
tree-sitter-xml = "0.7.0"
zed_actions = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }

[features]
test-support = []

[dev-dependencies]
supraman-editor = { path = ".", features = ["test-support"] }
supraman-ui = { path = "../supraman-ui" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c", default-features = false, features = ["test-support"] }
