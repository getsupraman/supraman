[package]
name = "foreman-workstate"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# A fake WorkState (HTTP + SSE + OAuth authorization server on 127.0.0.1) for other crates' tests.
fake = []

[dependencies]
async-channel = "2.5"
base64 = "0.22"
foreman-core = { path = "../foreman-core" }
getrandom = "0.3"
native-tls = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.12"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[dev-dependencies]
foreman-workstate = { path = ".", features = ["fake"] }
tempfile = "3.27.0"
