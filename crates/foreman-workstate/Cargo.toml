[package]
name = "foreman-workstate"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# A fake WorkState (HTTP + SSE on 127.0.0.1) for other crates' tests.
fake = []

[dependencies]
foreman-core = { path = "../foreman-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.12"
ureq = { version = "3", default-features = false }

[dev-dependencies]
foreman-workstate = { path = ".", features = ["fake"] }
tempfile = "3.27.0"
