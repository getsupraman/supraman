[package]
name = "sm"
version = "0.1.10"
edition = "2024"
publish = false
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sm"
path = "src/main.rs"

[[bin]]
name = "smw"
path = "src/bin/smw.rs"

[features]
# `sm probe …`: developer probes that start real claude sessions; off in a release build.
probes = []

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["alloc", "clock"] }
supraman-claude = { path = "../supraman-claude" }
supraman-core = { path = "../supraman-core" }
supraman-supervisor = { path = "../supraman-supervisor" }
supraman-workman = { path = "../supraman-workman" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
supraman-workman = { path = "../supraman-workman", features = ["fake"] }
tempfile = "3.27.0"
