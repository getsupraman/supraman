[package]
name = "fm"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "fm"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["alloc"] }
foreman-claude = { path = "../foreman-claude" }
foreman-core = { path = "../foreman-core" }
foreman-supervisor = { path = "../foreman-supervisor" }
foreman-workstate = { path = "../foreman-workstate" }
serde_json = "1.0.151"

[dev-dependencies]
foreman-workstate = { path = "../foreman-workstate", features = ["fake"] }
getrandom = "0.3"
tempfile = "3.27.0"
