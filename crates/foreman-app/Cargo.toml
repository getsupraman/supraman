[package]
name = "foreman-app"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[[bin]]
name = "foreman"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.86"
base64 = "0.22"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
collections = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
fm = { path = "../fm" }
foreman-claude = { path = "../foreman-claude" }
foreman-core = { path = "../foreman-core" }
foreman-supervisor = { path = "../foreman-supervisor" }
foreman-term = { path = "../foreman-term" }
foreman-ui = { path = "../foreman-ui" }
foreman-workstate = { path = "../foreman-workstate", features = ["fake"] }
futures = "0.3.34"
log = "0.4"
gpui = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c", default-features = false }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c", default-features = false }
theme = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
util = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
tray-icon = { version = "0.26.1", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3.27.0"
toml = "0.9.8"
