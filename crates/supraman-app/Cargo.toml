[package]
name = "supraman-app"
version = "0.1.5"
edition = "2024"
publish = false
license.workspace = true

[[bin]]
name = "supraman"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.86"
base64 = "0.22"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
iana-time-zone = "0.1.64"
collections = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
sm = { path = "../sm" }
supraman-claude = { path = "../supraman-claude" }
supraman-core = { path = "../supraman-core" }
supraman-supervisor = { path = "../supraman-supervisor" }
supraman-term = { path = "../supraman-term" }
supraman-ui = { path = "../supraman-ui" }
# `fake`: FakeWorkman serves the --selftest* modes, which ship in supraman.exe and run against the release build.
supraman-workman = { path = "../supraman-workman", features = ["fake"] }
futures = "0.3.34"
log = "0.4"
gpui = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c", default-features = false }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c", default-features = false }
theme = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
util = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
tray-icon = { version = "0.26.1", default-features = false }
windows = { version = "0.62", features = ["Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_Xps", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3.27.0"
toml = "0.9.8"
