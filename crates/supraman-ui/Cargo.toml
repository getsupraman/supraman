[package]
name = "supraman-ui"
version = "0.1.15"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
supraman-core = { path = "../supraman-core" }
supraman-term = { path = "../supraman-term" }
futures = "0.3.34"
gpui = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c", default-features = false }
itertools = "0.14"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
unicode-segmentation = "1.13"
url = "2.2"
theme = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }

[dev-dependencies]
tempfile = "3.27.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c", default-features = false, features = ["test-support"] }
