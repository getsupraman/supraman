[package]
name = "supraman-workman"
version = "0.1.4"
edition = "2024"
publish = false
license.workspace = true

[features]
# A fake Workman (HTTP + SSE + OAuth authorization server on 127.0.0.1) for other crates' tests.
fake = []

[dependencies]
async-channel = "2.5"
base64 = "0.22"
supraman-core = { path = "../supraman-core" }
getrandom = "0.3"
native-tls = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.12"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[dev-dependencies]
supraman-workman = { path = ".", features = ["fake"] }
tempfile = "3.27.0"
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2"] }
