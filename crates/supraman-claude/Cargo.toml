[package]
name = "supraman-claude"
version = "0.1.17"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
supraman-core = { path = "../supraman-core" }
memchr = "2.8.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.12"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO"] }
