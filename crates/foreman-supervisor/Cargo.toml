[package]
name = "foreman-supervisor"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
foreman-claude = { path = "../foreman-claude" }
foreman-core = { path = "../foreman-core" }
foreman-workstate = { path = "../foreman-workstate" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.12"
toml = "0.9.8"
ureq = { version = "3", default-features = false }

[dev-dependencies]
foreman-workstate = { path = "../foreman-workstate", features = ["fake"] }
tempfile = "3.27.0"
