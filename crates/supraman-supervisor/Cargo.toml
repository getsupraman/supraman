[package]
name = "supraman-supervisor"
version = "0.1.4"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
supraman-claude = { path = "../supraman-claude" }
supraman-core = { path = "../supraman-core" }
supraman-workman = { path = "../supraman-workman" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.12"
toml = "0.9.8"
ureq = { version = "3", default-features = false }

[dev-dependencies]
supraman-workman = { path = "../supraman-workman", features = ["fake"] }
tempfile = "3.27.0"
