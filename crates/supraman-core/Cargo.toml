[package]
name = "supraman-core"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "now", "serde"] }
ed25519-dalek = "2.2.0"
getrandom = "0.3"
hmac = "0.12.1"
roxmltree = "0.21"
semver = "1.0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.12"
toml = "0.9.8"
zeroize = "1.8.2"
# The deflate backend of zip (miniz_oxide, already in the tree).
flate2 = { version = "1.1.8", default-features = false, features = ["rust_backend"] }
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Ole", "Win32_System_StationsAndDesktops", "Win32_System_TaskScheduler", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"
